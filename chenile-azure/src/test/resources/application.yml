logging:
  level:
    ROOT: INFO
    org.hibernate.SQL: INFO



spring:
  chenile:
    azure:
      eventhubs:
        transport-type: AMQP_WEB_SOCKETS
        namespace: sb://localhost/;
        connection-string: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
        auto-start-consumers: false
        consumers:
          hubs:
            business-events:
              consumer-group: "eh1consumer"
            billing-events:
              consumer-group: "eh1consumer"
            shared-events:
              consumer-group: "eh1consumer"
            eh2:
              consumer-group: "eh2consumer"
        producers:
          - chenile
          - order-created
          - order-updated
          - invoice-paid
          - shipment-created
          - shipment-updated
          - refund-issued
          - customer-alert
        routes:
          chenile: business-events
          order-created: business-events
          order-updated: business-events
          invoice-paid: billing-events
          shipment-created: business-events
          shipment-updated: business-events
          refund-issued: billing-events
          eh2: eh2
        default-route: shared-events
        clients:
          - acme
          - beta
        client-prefix-separator: "-"
        dl:
          eh2




    storage:
      blob:
        endpoint: "http://localhost:10000/devstoreaccount1"
        container: "chenilequeue"
        credential-type: "key"   # options: "key" or "sas"

        # For Shared Key
        account-name: "devstoreaccount1"
        account-key: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="



